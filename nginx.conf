server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # connect-src is intentionally broad (any https:/wss: origin) to cover
    # the Supabase edge functions without hardcoding a domain here. Never
    # add the Ollama container's origin to this policy and never expose its
    # port (11434) publicly — only the edge functions talk to Ollama,
    # container-to-container, and the browser must never be able to reach
    # it directly.
    #
    # manifest-src and worker-src cover the installable-app assets. Both would
    # fall back to default-src 'self' anyway, but an auditor should not have to
    # derive that.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # IMPORTANT: no location block below may use add_header.
    #
    # nginx's add_header does not inherit into a location that declares any
    # add_header of its own. The asset block used to set Cache-Control that way,
    # which silently stripped all five headers above — including the CSP — from
    # every .js/.css/.png/.woff2 response.
    #
    # `expires` sets Cache-Control without touching add_header inheritance, so
    # cache policy is expressed with `expires` throughout and the security headers
    # now actually reach every response. The cost is that assets get max-age
    # without `immutable`; re-adding it would require add_header and would
    # reintroduce the bug unless all five headers were repeated in that block.

    # The service worker must never be cached. If it is, clients pin themselves to
    # a dead worker that no redeploy can reach — the fix would have to be served
    # by the very file they refuse to refetch. `expires -1` sends
    # Cache-Control: no-cache, so the browser revalidates every time.
    #
    # Exact-match locations outrank the regex block below regardless of file
    # order, so this wins over the .js rule without any ordering trick. sw.js is
    # the only un-hashed script Vite emits; workbox's own chunk is
    # workbox-<hash>.js and is safely covered by the asset rule.
    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        # .webmanifest is not in nginx's mime.types, so without this it ships as
        # application/octet-stream. Chrome tolerates that; the spec type is this.
        default_type application/manifest+json;
        expires -1;
    }

    # location / sets no expires, so browsers heuristically cache index.html.
    # Combined with hashed assets and workbox's cleanupOutdatedCaches, a stale
    # index.html can reference chunks that no longer exist.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?|ttf|eot|ico)$ {
        try_files $uri =404;
        expires 30d;
    }
}
