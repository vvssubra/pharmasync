# Gates merges, deliberately not deploys.
#
# Production builds run through Dockerfile -> `npm run build` on Coolify, which
# auto-builds on push. Wiring the typecheck into `build` would turn a type error
# into an outage for a live clinic, so `build` stays a bare `vite build` and the
# gate lives here instead.
#
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets legacy-peer-deps=true, matching Dockerfile and the other
      # deploy configs.
      - run: npm ci

      # typecheck + lint + test. Lint is enforced — the error count is zero as
      # of the fix that cleared the no-explicit-any backlog; only the 8
      # react-refresh warnings in shadcn ui files remain, and warnings do not
      # fail eslint's exit code.
      #
      # VITE_SUPABASE_URL/KEY below are placeholders, not secrets — tests mock
      # every Supabase call, but src/integrations/supabase/client.ts calls
      # createClient() at import time, which throws on an empty URL. Any
      # well-formed value satisfies it.
      - name: Verify
        env:
          VITE_SUPABASE_URL: "http://localhost:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "test-placeholder-key"
        run: npm run verify

      # The edge-function tests (src/lib <-> _shared mirror parity, input
      # sanitising) are Deno tests that vitest never picks up.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Edge function tests
        run: deno test --node-modules-dir=none --allow-read --allow-env --allow-net supabase/functions/_shared/

      # knowledge-service uses fs/promises glob (Node 22+); the app stays on .nvmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Knowledge service tests
        working-directory: knowledge-service
        run: npm ci && npm test
