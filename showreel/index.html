<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaSync Showreel</title>
<style>
@font-face{font-family:SG;src:url(fonts/SpaceGrotesk.woff2) format('woff2');font-weight:300 700}
@font-face{font-family:IN;src:url(fonts/Inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:JB;src:url(fonts/JetBrainsMono.woff2) format('woff2');font-weight:100 800}
:root{--ink:#04120E;--ink2:#0B211A;--ink3:#0E2A22;--em:#10B981;--mint:#6EE7B7;--deep:#064E3B;--cream:#F2EFE6;--paper:#ECE5D3;--amber:#F5B83D;--coral:#FF5E57;--blue:#5AA9FF;--muted:rgba(242,239,230,.55)}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--ink);overflow:hidden;transform-origin:0 0;font-family:IN;color:var(--cream);-webkit-font-smoothing:antialiased}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;overflow:hidden}
.abs{position:absolute}
.mono{font-family:JB;letter-spacing:.06em;font-weight:500}
.disp{font-family:SG;font-weight:700;letter-spacing:-.035em;line-height:1}
.mask{overflow:hidden;padding:.06em 0 .14em;margin:-.06em 0 -.14em}
.mask>div{will-change:transform}
.lbl{font-family:JB;font-size:18px;letter-spacing:.18em;color:var(--em);font-weight:600}
.chip{display:inline-block;font-family:JB;font-weight:700;font-size:15px;letter-spacing:.12em;padding:7px 12px;border-radius:999px}
.tile{position:absolute;width:540px;height:400px;border-radius:28px;background:linear-gradient(160deg,#0E2A22,#08191427);border:1px solid rgba(110,231,183,.16);overflow:hidden;transform-origin:50% 0;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.tile .tag{position:absolute;left:32px;top:28px;font-family:JB;font-size:14px;letter-spacing:.16em;color:var(--em);font-weight:600}
.tile .ttl{position:absolute;left:32px;bottom:58px;font-family:SG;font-weight:700;font-size:34px;letter-spacing:-.02em}
.tile .sub{position:absolute;left:32px;bottom:28px;font-size:17px;color:var(--muted)}
.tile .shine{position:absolute;top:0;bottom:0;width:180px;background:linear-gradient(100deg,transparent,rgba(110,231,183,.12),transparent);transform:translateX(-300px)}
#play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:600 16px JB,monospace;letter-spacing:.2em;color:#F2EFE6;background:rgba(0,0,0,.35);cursor:pointer;z-index:10}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 30, DUR = 66;
const stage = document.getElementById('stage');

/* ---------- math + easing ---------- */
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const pr = (t, a, d) => cl((t - a) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  lin: x => x,
  oExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oCubic: x => 1 - Math.pow(1 - x, 3),
  iCubic: x => x * x * x,
  ioCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  oBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oQuint: x => 1 - Math.pow(1 - x, 5),
};
const A = (t, a, d, e = E.oExpo) => e(pr(t, a, d));
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const shake = (t, t0, amp, dur = .45) => { const u = t - t0; if (u < 0 || u > dur) return [0, 0]; const k = amp * Math.pow(1 - u / dur, 2); return [k * Math.sin(u * 91), k * Math.cos(u * 77)]; };
const pulse = (t, beats, k = 9) => { let v = 0; for (const b of beats) { const u = t - b; if (u >= 0 && u < 1.2) v = Math.max(v, Math.exp(-u * k)); } return v; };
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ---------- dom helpers ---------- */
const SVGT = new Set(['svg','path','circle','line','rect','g','ellipse','polyline','polygon','defs','linearGradient','radialGradient','stop','text','filter','feGaussianBlur']);
const NS = 'http://www.w3.org/2000/svg';
function h(tag, attrs = {}, parent, html) {
  const el = SVGT.has(tag) ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const k in attrs) {
    if (k === 'style') el.style.cssText = attrs[k];
    else if (k === 'cls') el.setAttribute('class', attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  if (html != null) el.innerHTML = html;
  if (parent) parent.appendChild(el);
  return el;
}
const st = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const tr = (el, s) => { el.style.transform = s; };
// A masked line whose inner div rises into view.
function maskLine(parent, html, css) {
  const m = h('div', { cls: 'abs mask', style: css }, parent);
  const i = h('div', {}, m, html);
  return { m, i, set(p) { tr(i, `translateY(${(1 - p) * 115}%)`); } };
}
// Rolling digits. Returns {el, set(p)} where p in 0..1 rolls each digit into place.
function odometer(parent, str, css, loops = 2) {
  const box = h('div', { cls: 'abs', style: css + ';display:flex;line-height:1' }, parent);
  const cols = [];
  for (const ch of str) {
    if (/\d/.test(ch)) {
      const win = h('div', { style: 'overflow:hidden;height:1em;position:relative' }, box);
      const strip = h('div', { style: 'display:flex;flex-direction:column' }, win);
      for (let k = 0; k <= loops * 10 + 9; k++) h('div', { style: 'height:1em;text-align:center' }, strip, String(k % 10));
      cols.push({ strip, target: loops * 10 + (+ch) });
    } else h('div', { style: 'height:1em' }, box, ch === ' ' ? '&nbsp;' : ch);
  }
  return { el: box, set(p, stagger = .12) {
    cols.forEach((c, i) => { const q = E.oExpo(cl((p - i * stagger) / (1 - stagger * (cols.length - 1)))); tr(c.strip, `translateY(${-q * c.target}em)`); });
  } };
}

/* ---------- layers ---------- */
const layers = [];
function layer(start, end, z = 1, bg) {
  const el = h('div', { cls: 'layer', style: `z-index:${z};${bg ? 'background:' + bg : ''}` }, stage);
  const L = { el, start, end, update: () => {} };
  layers.push(L);
  return L;
}

/* icons (24x24, stroke) */
const ICON = {
  doctor: 'M9 3h6v3H9z M7 4.5H6a1.5 1.5 0 0 0-1.5 1.5v13.5A1.5 1.5 0 0 0 6 21h12a1.5 1.5 0 0 0 1.5-1.5V6A1.5 1.5 0 0 0 18 4.5h-1 M12 10v6 M9 13h6',
  shield: 'M12 2.8l7.2 3v6.1c0 4.4-3 7.6-7.2 9.3-4.2-1.7-7.2-4.9-7.2-9.3V5.8z M8.8 12.2l2.2 2.2 4.3-4.4',
  pill: 'M10.6 3.6a4.9 4.9 0 0 1 6.9 6.9l-7 7a4.9 4.9 0 0 1-6.9-6.9z M7.1 10.1l6.8 6.8',
  person: 'M12 11.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4.5 21c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5',
  check: 'M5 12.5l4.5 4.5L19 7.5',
};
function icon(parent, name, size, color, sw = 1.8, css = '') {
  const s = h('svg', { viewBox: '0 0 24 24', width: size, height: size, style: css, fill: 'none', stroke: color, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, parent);
  h('path', { d: ICON[name] }, s);
  return s;
}
function capsule(parent, w, hgt) {
  const c = h('div', { cls: 'abs', style: 'left:0;top:0;width:0;height:0' }, parent);
  const L = h('div', { cls: 'abs', style: `background:linear-gradient(180deg,#34D399,#0E9F6E);box-shadow:inset 0 -6px 12px rgba(0,0,0,.18)` }, c);
  const R = h('div', { cls: 'abs', style: `background:linear-gradient(180deg,#FFFDF7,#E4DFD2);box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)` }, c);
  return { c, set(w, hh, split = 0) {
    const r = hh / 2;
    st(L, { left: (-w / 2 - split) + 'px', top: -hh / 2 + 'px', width: w / 2 + 'px', height: hh + 'px', borderRadius: `${r}px 0 0 ${r}px` });
    st(R, { left: split + 'px', top: -hh / 2 + 'px', width: w / 2 + 'px', height: hh + 'px', borderRadius: `0 ${r}px ${r}px 0` });
  } };
}

function build() {
/* ================= S1 · COLD OPEN (0 – 6.6) ================= */
{
  const L = layer(0, 6.7, 6);
  const cap = capsule(L.el);
  st(cap.c, { left: '960px', top: '540px' });
  const words = ['EVERY', 'REQUEST.', 'EVERY', 'PATIENT.', 'EVERY', 'SIGNATURE.', 'COUNTS.'];
  const wEls = words.map((w, i) => {
    const outline = w === 'EVERY';
    return h('div', { cls: 'abs disp', style: `left:0;right:0;top:${i === 6 ? 380 : 430}px;text-align:center;font-size:${i === 6 ? 300 : 210}px;` +
      (outline ? 'color:transparent;-webkit-text-stroke:3px #F2EFE6' : `color:${i === 6 ? '#10B981' : '#F2EFE6'}`) + ';display:none' }, L.el, w);
  });
  const hint = h('div', { cls: 'abs mono', style: 'left:0;right:0;top:600px;text-align:center;font-size:16px;color:rgba(242,239,230,.5);letter-spacing:.3em' }, L.el, '');
  const beatsHit = [2, 2.5, 3, 3.5, 4, 4.5, 5];
  L.update = t => {
    let w = 26, hh = 26, rot = 0, sc = 1, op = 1, split = 0;
    const d = E.oBack(pr(t, .25, .5));
    w = hh = 26 * d * (1 + .5 * pulse(t, [.5, 1], 12));
    const s1 = A(t, 1.0, .75, E.ioExpo);
    if (t >= 1) { w = lerp(26, 240, s1); hh = lerp(26, 90, s1); rot = lerp(0, -35, s1); }
    for (const b of beatsHit) rot += 45 * E.oBack(pr(t, b, .32));
    const back = A(t, 2, .35);
    sc = lerp(1, 3, back); op = lerp(1, .16, back);
    const front = A(t, 5.5, .48, E.ioExpo);
    if (t >= 5.5) { const r0 = -35 + 7 * 45; rot = lerp(r0, 360, front); sc = lerp(3, 6.6, front); op = lerp(.16, 1, front); }
    split = lerp(0, 1500, A(t, 6.0, .6, E.iCubic));
    cap.set(w * sc, hh * sc, split);
    st(cap.c, { transform: `rotate(${rot}deg)`, opacity: op });
    // words
    let active = -1;
    for (let i = 0; i < 7; i++) if (t >= 2 + i * .5 && t < 2.5 + i * .5) active = i;
    wEls.forEach((el, i) => {
      if (i !== active) { el.style.display = 'none'; return; }
      const p = A(t, 2 + i * .5, .28);
      st(el, { display: 'block', transform: `scale(${lerp(1.35, 1, p)})`, filter: `blur(${(1 - p) * 14}px)`, opacity: cl(p * 2), letterSpacing: `${lerp(.12, -.035, p)}em` });
    });
    const typed = '// INITIALISING PHARMASYNC';
    hint.textContent = t < 1.9 ? typed.slice(0, Math.floor(cl((t - .6) / .9) * typed.length)) + (Math.floor(t * 4) % 2 ? '_' : ' ') : '';
    hint.style.opacity = t < 1.9 ? 1 : 0;
  };
}

/* ================= S2 · TITLE (5.95 – 10.3) ================= */
{
  const L = layer(5.95, 10.3, 2);
  const cam = h('div', { cls: 'abs', style: 'inset:0' }, L.el);
  const vl = [], hl = [];
  for (let x = 0; x <= W; x += 120) vl.push(h('div', { cls: 'abs', style: `left:${x}px;top:0;width:1px;height:1080px;background:rgba(110,231,183,.09)` }, cam));
  for (let y = 60; y <= H; y += 120) hl.push(h('div', { cls: 'abs', style: `left:0;top:${y}px;width:1920px;height:1px;background:rgba(110,231,183,.09)` }, cam));
  const ring = h('div', { cls: 'abs', style: 'left:960px;top:540px;border-radius:50%;border:solid #10B981' }, cam);
  const label = h('div', { cls: 'abs lbl', style: 'left:0;right:0;top:352px;text-align:center' }, cam, '');
  const title = h('div', { cls: 'abs disp', style: 'left:0;right:0;top:400px;display:flex;justify-content:center;font-size:210px' }, cam);
  const letters = [];
  'PharmaSync'.split('').forEach((ch, i) => {
    const m = h('div', { cls: 'mask' }, title);
    letters.push(h('div', { style: `color:${i >= 6 ? '#10B981' : '#F2EFE6'}` }, m, ch));
  });
  const under = h('div', { cls: 'abs', style: 'left:0;top:648px;height:6px;background:#10B981;transform-origin:0 50%' }, cam);
  const sub = h('div', { cls: 'abs mono', style: 'left:0;right:0;top:700px;text-align:center;font-size:26px;color:rgba(242,239,230,.8);letter-spacing:.04em' }, cam, '');
  const subTxt = 'Controlled-drug quota, antibiotic forms & AI dose guidance for public health clinics.';
  let syncBox = null;
  L.update = t => {
    if (!syncBox) { const a = letters[6].getBoundingClientRect(), b = letters[9].getBoundingClientRect(), s = stage.getBoundingClientRect(), k = s.width / W; syncBox = [(a.left - s.left) / k, (b.right - s.left) / k]; }
    const g = A(t, 6.05, 1.4, E.oCubic);
    vl.forEach((el, i) => { const dist = Math.abs(i * 120 - 960) / 960; tr(el, `scaleY(${cl(g * 1.6 - dist * .6)})`); });
    hl.forEach((el, i) => { const dist = Math.abs(60 + i * 120 - 540) / 540; tr(el, `scaleX(${cl(g * 1.6 - dist * .6)})`); });
    const rp = A(t, 6.0, 1.1, E.oCubic), r = lerp(20, 1300, rp);
    st(ring, { width: 2 * r + 'px', height: 2 * r + 'px', marginLeft: -r + 'px', marginTop: -r + 'px', borderWidth: lerp(40, 0, rp) + 'px', opacity: 1 - rp });
    letters.forEach((el, i) => { const p = A(t, 6.12 + i * .045, .8); tr(el, `translateY(${(1 - p) * 110}%) rotate(${(1 - p) * 8}deg)`); });
    const lt = '[ 01 ]   INTRODUCING';
    label.textContent = lt.slice(0, Math.floor(A(t, 6.5, .5, E.lin) * lt.length));
    if (syncBox) { st(under, { left: syncBox[0] + 'px', width: (syncBox[1] - syncBox[0]) + 'px' }); tr(under, `scaleX(${A(t, 7.0, .7)})`); }
    const n = Math.floor(A(t, 7.2, 1.3, E.lin) * subTxt.length);
    sub.textContent = subTxt.slice(0, n) + (t < 9 && Math.floor(t * 4) % 2 ? '▌' : ' ');
    tr(cam, `scale(${lerp(1, 1.07, pr(t, 6, 4.3))})`);
  };
}

/* ================= S3 · THE PROBLEM (10.0 – 15.7) ================= */
{
  const L = layer(10.0, 15.7, 3);
  const box = h('div', { cls: 'abs', style: 'inset:0;background:#ECE5D3;transform-origin:50% 50%' }, L.el);
  h('div', { cls: 'abs', style: 'inset:0;background:repeating-linear-gradient(0deg,rgba(20,32,27,.035) 0 1px,transparent 1px 44px)' }, box);
  const lbl = h('div', { cls: 'abs lbl', style: 'left:140px;top:236px;color:#B4412F' }, box, '[ 02 ]   THE PROBLEM');
  const lines = [
    maskLine(box, 'WhatsApp approvals.', 'left:140px;top:290px;font:700 92px SG;letter-spacing:-.035em;color:#14201B'),
    maskLine(box, 'Paper AMS forms.', 'left:140px;top:392px;font:700 92px SG;letter-spacing:-.035em;color:#14201B'),
    maskLine(box, 'A quota that never', 'left:140px;top:494px;font:700 92px SG;letter-spacing:-.035em;color:#14201B'),
    maskLine(box, 'quite <span style="position:relative;display:inline-block">adds up.<i class="abs" style="left:-6px;right:-6px;top:52%;height:9px;background:#E0483C;transform-origin:0 50%;transform:scaleX(0)"></i></span>', 'left:140px;top:596px;font:700 92px SG;letter-spacing:-.035em;color:#14201B'),
  ];
  const strike = lines[3].i.querySelector('i');
  const textWrap = [lbl, ...lines.map(l => l.m)];
  // bin card
  const card = h('div', { cls: 'abs', style: 'left:1110px;top:150px;width:660px;height:790px;background:#FBF8F0;border-radius:6px;box-shadow:0 40px 90px rgba(40,30,10,.25),0 2px 0 rgba(0,0,0,.05);transform-origin:50% 50%' }, box);
  h('div', { cls: 'abs mono', style: 'left:40px;top:34px;font-size:15px;color:#7A6E58;letter-spacing:.22em' }, card, 'SENARAI KUOTA UKK  ·  2026');
  h('div', { cls: 'abs', style: 'left:40px;top:64px;font:700 36px SG;color:#14201B;letter-spacing:-.02em' }, card, 'Helaian Excel, kaunter farmasi');
  h('div', { cls: 'abs', style: 'left:40px;right:40px;top:126px;height:2px;background:#14201B' }, card);
  const colX = [40, 190, 400, 540];
  ['TARIKH', 'PESAKIT', 'FMS', 'BAKI'].forEach((c, i) => h('div', { cls: 'abs mono', style: `left:${colX[i]}px;top:142px;font-size:14px;color:#7A6E58;letter-spacing:.18em` }, card, c));
  const rows = [['03/03', 'A. Rahman', 'Dr T.', '311'], ['05/03', 'Lim K.H.', 'Dr T.', '310'], ['09/03', 'Pesara', '—', '310'], ['11/03', 'S. Devi', 'Dr A.', '309'], ['14/03', 'Wong M.', '?', '308'], ['18/03', 'Nur A.', 'Dr T.', '307'], ['20/03', 'Tan B.', '', '?'], ['22/03', '', '', '']];
  const rr = rng(7);
  const rowEls = rows.map((r, i) => {
    const y = 186 + i * 68;
    h('div', { cls: 'abs', style: `left:40px;right:40px;top:${y + 60}px;height:1px;background:rgba(20,32,27,.14)` }, card);
    const row = h('div', { cls: 'abs', style: `left:0;right:0;top:${y}px;height:64px;transform:rotate(${(rr() - .5) * 1.6}deg)` }, card);
    r.forEach((v, j) => h('div', { cls: 'abs', style: `left:${colX[j] + (rr() - .5) * 8}px;top:14px;font:500 30px IN;font-style:oblique 12deg;color:#2B3E8C;letter-spacing:-.01em` }, row, v));
    return row;
  });
  const svg = h('svg', { cls: 'abs', width: 660, height: 790, style: 'left:0;top:0;overflow:visible' }, card);
  const circ = h('path', { d: 'M520 610 C 610 596, 640 640, 590 668 C 540 690, 440 684, 438 640 C 436 604, 500 592, 560 604', fill: 'none', stroke: '#E0483C', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-dasharray': 600, 'stroke-dashoffset': 600 }, svg);
  const note = h('div', { cls: 'abs', style: 'left:430px;top:706px;font:600 30px IN;font-style:oblique 12deg;color:#E0483C;transform:rotate(-4deg)' }, card, 'baki sebenar: ?');
  // chaos cards
  const r2 = rng(42);
  const chaos = [];
  for (let i = 0; i < 16; i++) {
    const el = h('div', { cls: 'abs', style: `left:0;top:0;width:360px;height:440px;background:#FBF8F0 repeating-linear-gradient(0deg,transparent 0 58px,rgba(20,32,27,.12) 58px 60px);border-radius:6px;box-shadow:0 30px 70px rgba(40,30,10,.28)` }, box);
    h('div', { cls: 'abs', style: `left:28px;top:26px;width:${140 + r2() * 120}px;height:14px;background:rgba(20,32,27,.7);border-radius:3px` }, el);
    const side = Math.floor(r2() * 3);
    const sx = side === 0 ? -500 : side === 1 ? 2100 : r2() * 1920, sy = side === 2 ? 1300 : r2() * 1080;
    chaos.push({ el, sx, sy, ex: 380 + r2() * 1200, ey: 80 + r2() * 560, rot0: (r2() - .5) * 120, rot: (r2() - .5) * 44, t0: 13.15 + i * .085 });
  }
  L.update = t => {
    lines.forEach((l, i) => l.set(A(t, 10.3 + i * .38, .7)));
    tr(strike, `scaleX(${A(t, 12.4, .35, E.oCubic)})`);
    st(lbl, { opacity: A(t, 10.2, .4, E.lin) });
    tr(card, `translate(${lerp(260, 0, A(t, 10.1, .9))}px, ${lerp(80, 0, A(t, 10.1, .9))}px) rotate(${lerp(9, 2.5, A(t, 10.1, 1))}deg)`);
    card.style.opacity = A(t, 10.1, .3, E.lin);
    rowEls.forEach((row, i) => { row.style.clipPath = `inset(0 ${(1 - A(t, 10.6 + i * .2, .35, E.oCubic)) * 100}% 0 0)`; });
    circ.setAttribute('stroke-dashoffset', 600 * (1 - A(t, 12.3, .5, E.ioCubic)));
    st(note, { opacity: A(t, 12.75, .2, E.lin) });
    chaos.forEach(c => {
      const p = A(t, c.t0, .7);
      st(c.el, { display: t < c.t0 ? 'none' : 'block', transform: `translate(${lerp(c.sx, c.ex, p)}px,${lerp(c.sy, c.ey, p)}px) rotate(${lerp(c.rot0, c.rot, p)}deg)` });
    });
    const out = A(t, 13.5, .7, E.iCubic);
    textWrap.forEach((el, i) => st(el, { transform: `translateX(${-out * (700 + i * 60)}px)` }));
    const [sx, sy] = shake(t, 14.1, 10);
    const sq = A(t, 15.05, .5, E.iExpo);
    tr(box, `translate(${sx}px,${sy}px) scale(${lerp(1, 1.03, sq)}, ${lerp(1, .003, sq)})`);

const hud = h('div', { cls: 'abs', style: 'inset:0;z-index:60;pointer-events:none;mix-blend-mode:difference;color:#fff' }, stage);
const marks = [[40, 40, '1px 0 0 1px'], [W - 70, 40, '1px 1px 0 0'], [40, H - 70, '0 0 1px 1px'], [W - 70, H - 70, '0 1px 1px 0']].map(([x, y, b]) =>
  h('div', { cls: 'abs', style: `left:${x}px;top:${y}px;width:30px;height:30px;border:solid #fff;border-width:${b.split(' ').map(v => v === '1px' ? '2px' : '0').join(' ')}` }, hud));
const hTL = h('div', { cls: 'abs mono', style: 'left:84px;top:44px;font-size:14px;letter-spacing:.24em' }, hud, 'PHARMASYNC — SHOWREEL ’26');
const hTR = h('div', { cls: 'abs mono', style: 'right:84px;top:44px;font-size:14px;letter-spacing:.2em;font-variant-numeric:tabular-nums' }, hud);
const hBL = h('div', { cls: 'abs mono', style: 'left:84px;bottom:44px;font-size:14px;letter-spacing:.24em' }, hud);
const hBR = h('div', { cls: 'abs', style: 'right:84px;bottom:50px;width:220px;height:2px;background:rgba(255,255,255,.3)' }, hud);
const hBRf = h('div', { cls: 'abs', style: 'left:0;top:0;bottom:0;background:#fff' }, hBR);
const SECT = [[0, '00 / 07 — COLD OPEN'], [6, '01 / 07 — INTRO'], [10, '02 / 07 — THE PROBLEM'], [16, '03 / 07 — THE QUOTA'], [24, '04 / 07 — THE WORKFLOW'], [34, '05 / 07 — THE TOOLKIT'], [42, '06 / 07 — SCALE'], [50, '07 / 07 — IMPACT'], [56, 'FIN']];
const grainTiles = [0, 1, 2].map(k => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); const d = x.createImageData(256, 256); const rr = rng(99 + k); for (let i = 0; i < d.data.length; i += 4) { const v = rr() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c.toDataURL(); });
const grain = h('div', { cls: 'abs', style: 'inset:0;z-index:70;opacity:.055;pointer-events:none;mix-blend-mode:overlay' }, stage);
h('div', { cls: 'abs', style: 'inset:0;z-index:65;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 30%,rgba(0,0,0,.08) 55%,rgba(0,0,0,.22) 78%,rgba(0,0,0,.4) 100%)' }, stage);
if (new URLSearchParams(location.search).has('clean')) grain.style.display = 'none';
const fadeK = h('div', { cls: 'abs', style: 'inset:0;z-index:80;background:#000;pointer-events:none' }, stage);

window.__renderAt = t => {
  for (const L of layers) {
    const on = t >= L.start && t < L.end;
    L.el.style.display = on ? 'block' : 'none';
    if (on) L.update(t);
  }
  for (const w of wipes) {
    const n = w.bars.length;
    w.bars.forEach((b, i) => {
      const c = A(t, w.T - .42 + i * .07, .3, E.ioCubic);
      const u = A(t, w.T + .02 + (n - 1 - i) * .07, .32, E.ioCubic);
      const on = c > 0 && u < 1;
      b.style.display = on ? 'block' : 'none';
      if (on) tr(b, `translateX(${(-1 + c + u) * 100}%)`);
    });
  }
  const f = Math.floor(t * FPS + 1e-6);
  const s = Math.floor(t), ff = f % FPS;
  hTR.textContent = `TC 00:00:${String(s).padStart(2, '0')}:${String(ff).padStart(2, '0')}`;
  let sec = SECT[0][1]; for (const [a, n] of SECT) if (t >= a) sec = n;
  hBL.textContent = sec;
  hBRf.style.width = (t / DUR * 100) + '%';
  hud.style.opacity = A(t, 1.6, .5, E.lin) * (1 - A(t, 58.6, .5, E.lin));
  grain.style.backgroundImage = `url(${grainTiles[f % 3]})`;
  grain.style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`;
  fadeK.style.opacity = t < .15 ? 1 - t / .15 : t > DUR - .3 ? A(t, DUR - .3, .3, E.lin) : 0;
};
}

/* ---------- boot ---------- */
const params = new URLSearchParams(location.search);
window.__ready = document.fonts.ready.then(() => { build(); window.__renderAt(0); return true; });
if (!params.has('render')) {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; stage.style.left = (innerWidth - W * k) / 2 + 'px'; stage.style.top = (innerHeight - H * k) / 2 + 'px'; };
  addEventListener('resize', fit); fit();
  const audio = new Audio('music.m4a');
  let t0 = performance.now(), withAudio = false;
  const btn = h('div', { id: 'play' }, document.body, '▶  CLICK TO PLAY WITH SOUND');
  btn.onclick = () => { btn.remove(); audio.currentTime = 0; audio.play().then(() => { withAudio = true; }).catch(() => {}); t0 = performance.now(); };
  window.__ready.then(() => {
    const loop = () => {
      let t = withAudio ? audio.currentTime : ((performance.now() - t0) / 1000) % DUR;
      if (withAudio && audio.ended) { audio.currentTime = 0; audio.play(); }
      window.__renderAt(Math.min(t, DUR - .001));
      requestAnimationFrame(loop);
    };
    loop();
  });
}
</script>
</body>
